name: Publish KMP SDK

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Maven & npm
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Set environment variables
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          
          if [ "$BRANCH_NAME" = "develop" ]; then
            echo "IS_SNAPSHOT=true" >> $GITHUB_ENV
            echo "Publishing SNAPSHOT version from develop branch"
          elif [ "$BRANCH_NAME" = "main" ]; then
            echo "IS_SNAPSHOT=false" >> $GITHUB_ENV
            echo "Publishing RELEASE version from main branch"
          else
            echo "IS_SNAPSHOT=true" >> $GITHUB_ENV
            echo "️[WARNING] Publishing SNAPSHOT version from $BRANCH_NAME branch"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build SDK
        run: ./gradlew :sdk:build :sdk:jsNodeProductionLibraryDistribution :sdk:assembleKmpsdkReleaseXCFramework
        env:
          IS_SNAPSHOT: ${{ env.IS_SNAPSHOT }}

      - name: Publish to GitHub Packages (Maven)
        run: ./gradlew :sdk:publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_SNAPSHOT: ${{ env.IS_SNAPSHOT }}

      - name: Verify productionLibrary exists before npm publish
        run: |
          if [ -d "sdk/build/dist/js/productionLibrary" ]; then
            echo "[SUCCESS] productionLibrary exists"
            ls -la sdk/build/dist/js/productionLibrary || true
          else
            echo "[ERROR] Missing sdk/build/dist/js/productionLibrary - jsNodeProductionLibraryDistribution may have failed"
            exit 1
          fi

      - name: Publish npm to GitHub Packages
        run: |
          cd sdk/build/dist/js/productionLibrary
          
          # Configure npm to use GitHub Packages registry for @gilbertohdz scope
          npm config set @gilbertohdz:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
          
          # Get the version from package.json
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          # Check if this is a snapshot build
          if [ "${{ env.IS_SNAPSHOT }}" = "true" ]; then
            echo "📦 Publishing SNAPSHOT npm package version $PACKAGE_VERSION to GitHub Packages"
            npm publish
          else
            echo "📦 Publishing RELEASE npm package version $PACKAGE_VERSION to GitHub Packages"
            npm publish
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create XCFramework ZIP
        run: |
          cd sdk/build/XCFrameworks/release
          if [ -d "kmpsdk.xcframework" ]; then
            echo "[SUCCESS] XCFramework found, creating ZIP..."
            zip -r kmpsdk.xcframework.zip kmpsdk.xcframework
            echo "[SUCCESS] ZIP created successfully"
            ls -lh kmpsdk.xcframework.zip
          else
            echo "[ERROR] XCFramework not found at sdk/build/XCFrameworks/release/kmpsdk.xcframework"
            exit 1
          fi

      - name: Calculate XCFramework Checksum
        if: success() && env.IS_SNAPSHOT != 'true'
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum sdk/build/XCFrameworks/release/kmpsdk.xcframework.zip)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "XCFramework Checksum: $CHECKSUM"

      - name: Create GitHub Release
        if: success() && env.IS_SNAPSHOT != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: sdk/build/XCFrameworks/release/kmpsdk.xcframework.zip
          body: |
            # KMPSdk Release ${{ github.ref_name }}
            
            ## Artifacts Published
            
            ### Maven
            - **Package:** `com.gilbertohdz:kmpsdk:${{ github.ref_name }}`
            - **Repository:** [GitHub Packages](https://github.com/GilbertoHdz/KMPSdk/packages)
            - **Install:** 
              ```gradle
              implementation("com.gilbertohdz:kmpsdk:${{ github.ref_name }}")
              ```
            
            ### npm
            - **Package:** `@gilbertohdz/kmpsdk@${{ github.ref_name }}`
            - **Repository:** [GitHub Packages](https://github.com/GilbertoHdz/KMPSdk/packages)
            - **Install:**
              ```bash
              npm install @gilbertohdz/kmpsdk@${{ github.ref_name }}
              ```
            
            ### Swift Package Manager (XCFramework)
            - **File:** `kmpsdk.xcframework.zip`
            - **Checksum:** `${{ steps.checksum.outputs.checksum }}`
            
            #### Usage in Package.swift
            ```swift
            .binaryTarget(
                name: "kmpsdk",
                url: "https://github.com/GilbertoHdz/KMPSdk/releases/download/${{ github.ref_name }}/kmpsdk.xcframework.zip",
                checksum: "${{ steps.checksum.outputs.checksum }}"
            )
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version Type:** $([ "${{ env.IS_SNAPSHOT }}" = "true" ] && echo "SNAPSHOT" || echo "RELEASE")" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $(grep 'VERSION_NAME' gradle.properties | cut -d'=' -f2)$([ "${{ env.IS_SNAPSHOT }}" = "true" ] && echo "-SNAPSHOT" || echo "")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Artifacts to GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "- [SUCCESS] Maven: \`com.gilbertohdz:kmpsdk\`" >> $GITHUB_STEP_SUMMARY
          echo "- [SUCCESS] npm: \`@gilbertohdz/kmpsdk\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.IS_SNAPSHOT }}" != "true" ]; then
            echo "- [SUCCESS] GitHub Release: \`kmpsdk.xcframework.zip\`" >> $GITHUB_STEP_SUMMARY
            echo "- [SUCCESS] SPM Checksum: \`${{ steps.checksum.outputs.checksum }}\`" >> $GITHUB_STEP_SUMMARY
          fi
